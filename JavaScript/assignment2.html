<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Pricing</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #038b8b, #f0e5ff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        body>div {
            width: 600px;
        }

        form {
            background: linear-gradient(135deg, #0d022c, #292331);
            padding: 30px 35px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
            color: white;
        }

        h1 {
            text-align: center;
            color: white;
            font-size: 26px;
            margin-bottom: 25px;
        }

        h2 {
            background-color: white;
            color: black;
            text-align: center;
            padding: 10px;
            font-size: 19px;
            margin: 20px 0;
        }

        form label {
            display: inline-block;
            width: 160px;
            margin: 10px 0;
            font-weight: bold;
        }

        input[type="text"],
        input[type="date"],
        select {
            width: 250px;
            padding: 8px;
            border: none;
            border-radius: 3px;
            margin-bottom: 10px;
        }

        p {
            font-weight: bold;
        }

        input[type="radio"] {
            margin: 10px 5px 10px 0;
        }

        button {
            display: block;
            margin: 25px auto 0;
            padding: 10px 28px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background-color: black;
        }
    </style>
</head>

<body>
    <div>
        <h1>Bus Booking System</h1>
        <h2>User Information</h2>

        <form>
            <label for="userName">User Name</label>
            <input type="text" id="userName" name="userName">

            <label for="userAge">User Age</label>
            <input type="text" id="userAge" name="userAge">

            <label for="userAadhar">User AadharNo</label>
            <input type="text" id="userAadhar" name="userAadhar">

            <label for="city">Select Your City</label>
            <select name="city" id="city">
                <option>Select City</option>
                <option>Agra</option>
                <option>Mumbai</option>
                <option>Lucknow</option>
                <option>Noida</option>
                <option>Jaipur</option>
                <option>Kanpur</option>
            </select>

            <label for="Date">Select Date</label>
            <input type="date" id="Date" name="Date">


            <h2>Bus Pricing</h2>
            <p>Select your Bus Type:</p>

            <input type="radio" id="acBus" name="bus" value="AC Bus">
            <label for="acBus">AC Bus 2000</label>

            <br>

            <input type="radio" id="nonAcBus" name="bus" value="Non-AC Bus">
            <label for="nonAcBus">Non-AC Bus 1500</label>

            <br><br>
            <label for="seat">Select your Seat</label>

            <select name="seat" id="seat">
                <option>Select Seat</option>
                <option>1</option>
                <option>2</option>
                <option>3</option>
                <option>4</option>
                <option>5</option>
            </select>

            <br><br>
            <button type="submit">Book Now</button>
        </form>
    </div>
</body>

</html>
