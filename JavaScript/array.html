<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const car=["car1","car2","car3"];
        let text=" "; //Declare null variable or let text;
        for(let i=0;i<car.length;i++){
            if(car[i]=="car2"){
                continue; 
            }
            text+=car[i]+"<br>";
        }
        document.write(text);
        document.getElementById("demo").innerHTML=text;
    </script>
    <p id="demo"></p>
</body>
</html>
